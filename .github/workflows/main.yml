name: Build furnace-peek-jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Build only this mod
        run: |
          SRC=$(find . -name FurnacePeekClient.java -not -path './.git/*' | head -n 1)
          if [ -z "$SRC" ]; then echo "Could not find FurnacePeekClient.java"; exit 1; fi
          DIR=${SRC%/src/main/java/*}
          echo "Building in $DIR"
          cd "$DIR"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          for j in build/libs/*.jar; do
            case "$j" in *-sources.jar) ;; *) cp "$j" "$GITHUB_WORKSPACE/out/" ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: furnace-peek-jar
          path: out/*.jar
